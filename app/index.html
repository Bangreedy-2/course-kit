<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coursekit</title>
<!-- Where course packs live, relative to this page. The local helper serves them at the same path. -->
<meta name="coursekit-packs" content="../packs/">
<meta name="coursekit-pyodide" content="https://cdn.jsdelivr.net/pyodide/v314.0.8/full/">
<meta name="coursekit-stlite" content="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.3/build/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&family=Sora:wght@500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="row"><div class="sub" id="brand-sub">Coursekit</div><button class="btn ghost" id="courses" title="Switch course">Courses</button></div><h1 id="brand-title">Coursekit</h1></div>
    <svg class="curve" id="curve" viewBox="0 0 340 64" role="img" aria-label="Overall progress"></svg>
  </header>
  <section class="strip" id="strip" aria-label="Status"></section>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="today" aria-selected="true">Today</button>
    <button role="tab" data-tab="plan" aria-selected="false">Plan</button>
    <button role="tab" data-tab="library" aria-selected="false">Lessons</button>
    <button role="tab" data-tab="projects" aria-selected="false">Projects</button>
    <button role="tab" data-tab="record" aria-selected="false">Record</button>
  </nav>
  <main id="main"><p class="muted">Loading…</p></main>
</div>
<script src="js/text.js"></script>
<script src="js/app.js"></script>
</body>
</html>
